<!DOCTYPE html>

<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#000;
color:#fff;
font-family:'Poppins',sans-serif;
}

header{
padding:100px 20px 50px;
text-align:center;
}

header h1{
color:#D4AF37;
font-family:'Playfair Display',serif;
font-size:3rem;
margin-bottom:15px;
}

header p{
color:#ddd;
font-size:1.1rem;
}

.section-title{
text-align:center;
color:#D4AF37;
font-family:'Playfair Display',serif;
margin:70px 0 35px;
font-size:2.2rem;
}

.pricing-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
margin-bottom:60px;
}

.price-card{
background:#151515;
border:1px solid rgba(212,175,55,.25);
border-radius:20px;
padding:35px;
box-shadow:0 15px 35px rgba(0,0,0,.35);
transition:.35s;
}

.price-card:hover{
transform:translateY(-8px);
border-color:#D4AF37;
}

.price-card h2{
color:#F5E6A9;
margin-bottom:10px;
}

.badge-popular{
display:inline-block;
background:#D4AF37;
color:#000;
padding:6px 14px;
border-radius:50px;
font-size:.8rem;
font-weight:700;
margin-bottom:15px;
}

.price{
font-size:2.3rem;
font-weight:700;
color:#D4AF37;
margin:20px 0;
}

.price-card ul{
padding-left:22px;
margin-bottom:30px;
}

.price-card li{
margin-bottom:12px;
line-height:1.7;
}

.paypal-box{
text-align:center;
margin-top:20px;
}

.secure{
text-align:center;
margin-top:70px;
}

.secure h2{
color:#D4AF37;
}

.buttons{
text-align:center;
margin:50px 0;
}

.buttons a{
margin:10px;
}

@media(max-width:768px){

header{
padding:80px 20px 30px;
}

header h1{
font-size:2.3rem;
}

.price-card{
padding:25px;
}

}

</style>

</head>
